services:
  app:
    build: .
    container_name: sql-mig-app
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://sql_mig:sql_mig@sql-mig-database:5432/sql_mig
    depends_on:
      database:
        condition: service_healthy
    command: sleep infinity

  database:
    image: postgres:16-alpine
    container_name: sql-mig-database
    environment:
      POSTGRES_DB: sql_mig
      POSTGRES_USER: sql_mig
      POSTGRES_PASSWORD: sql_mig
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sql_mig -d sql_mig"]
      interval: 2s
      timeout: 5s
      retries: 30
